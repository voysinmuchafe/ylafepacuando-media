name: Prepare Instagram transport

on:
  push:
    branches: [main]
    paths:
      - "published/*.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare transport JPEGs
        shell: bash
        run: |
          mapfile -t files < <(find published -maxdepth 1 -type f -name '*.png' -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PNG masters found."
            exit 0
          fi
          python scripts/prepare_transport.py "${files[@]}"

      - name: Commit changed transport files
        shell: bash
        run: |
          if git diff --quiet -- transport/; then
            echo "No transport changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport/
          git commit -m "chore: refresh Instagram transport JPEGs"
          git push
